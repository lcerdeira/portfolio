<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0e9"/>
      <stop offset="0.4" stop-color="#fff0dc"/>
      <stop offset="0.75" stop-color="#e6fffa"/>
      <stop offset="1" stop-color="#f0e7ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ff6b8a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.30" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.75" cy="0.80" r="0.5">
      <stop offset="0" stop-color="#4ecdc4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="0.20" cy="0.80" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ff6b8a"/>
      <stop offset="0.33" stop-color="#ffb347"/>
      <stop offset="0.66" stop-color="#4ecdc4"/>
      <stop offset="1"   stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow4)"/>

  <!-- DNA helix mark -->
  <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M960 90 Q1050 200 960 310 Q870 420 960 530"/>
    <path d="M1100 90 Q1010 200 1100 310 Q1190 420 1100 530"/>
    <line x1="975" y1="130" x2="1085" y2="130"/>
    <line x1="985" y1="190" x2="1075" y2="190"/>
    <line x1="985" y1="250" x2="1075" y2="250"/>
    <line x1="975" y1="310" x2="1085" y2="310"/>
    <line x1="985" y1="370" x2="1075" y2="370"/>
    <line x1="985" y1="430" x2="1075" y2="430"/>
    <line x1="975" y1="490" x2="1085" y2="490"/>
  </g>

  <!-- Confetti dots -->
  <g opacity="0.85">
    <circle cx="120" cy="120" r="6" fill="#ff6b8a"/>
    <circle cx="180" cy="80"  r="4" fill="#ffb347"/>
    <circle cx="80"  cy="180" r="3" fill="#4ecdc4"/>
    <circle cx="900" cy="80"  r="5" fill="#a78bfa"/>
    <circle cx="850" cy="560" r="4" fill="#ff6b8a"/>
    <circle cx="120" cy="540" r="5" fill="#ffb347"/>
    <circle cx="160" cy="580" r="3" fill="#4ecdc4"/>
  </g>

  <!-- Mono tag -->
  <text x="80" y="100" font-family="JetBrains Mono, monospace" font-size="22" fill="#ff6b8a" letter-spacing="6">
    DR · LOUISE · CERDEIRA
  </text>

  <!-- Name -->
  <text x="80" y="260" font-family="Newsreader, Georgia, serif" font-size="120" font-weight="400" fill="#2d1b4e">
    Dr. Louise
  </text>
  <text x="80" y="380" font-family="Newsreader, Georgia, serif" font-size="120" font-style="italic" fill="url(#accent)">
    Cerdeira ✦
  </text>

  <!-- Subtitle -->
  <text x="80" y="465" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#6a5b85">
    Computational Biologist · Software Engineer
  </text>
  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#6a5b85">
    Genomic Surveillance · AMR · Open Science
  </text>

  <!-- Bottom strip -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
  <text x="80" y="595" font-family="JetBrains Mono, monospace" font-size="18" fill="#6a5b85" letter-spacing="3">
    AMRnet · TyphiNET · PlasmidNET · InfectoNET
  </text>
</svg>
