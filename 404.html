<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Dr. Louise Cerdeira</title>
  <meta name="description" content="Page not found. Head back to the homepage." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <section class="hero" style="min-height: 100vh; text-align: left;">
    <div class="container hero-inner">
      <div>
        <p class="hero-eyebrow"><span class="dot"></span>Error 404 · Sequence not found</p>
        <h1>Wrong<br><span class="accent">turn.</span></h1>
        <p class="hero-tag">
          This page doesn't exist — or no longer does. Maybe a stale link, maybe a typo,
          maybe a bug I haven't found yet. Sorry for the detour.
        </p>
        <div class="hero-cta">
          <a href="/" class="btn btn-primary">Take me home <span class="arrow">→</span></a>
          <a href="/blog.html" class="btn">Read the blog</a>
          <a href="https://github.com/lcerdeira" target="_blank" rel="noopener" class="btn btn-ghost">GitHub</a>
        </div>
        <p class="text-mono text-faint" style="font-size: var(--fs-xs); margin-top: var(--space-7); letter-spacing: 0.12em; text-transform: uppercase;">
          $ grep -r &quot;<span id="path"></span>&quot; site/ → no match
        </p>
      </div>
    </div>
  </section>
  <script>
    document.getElementById("path").textContent = window.location.pathname || "/";
  </script>
</body>
</html>
